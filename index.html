<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>
    <!-- style -->
    <link rel="stylesheet" href="./style.css">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>
    <div class="main-container">
        <!-- Heading -->
        <div class="heading">
            <h1>
                <i class="fa-solid fa-cloud-sun"></i>
                Weather App
            </h1>
            <p>Discover the weather conditions of any location</p>
        </div>
        <!-- Main Container -->
        <div class="weather-container">
            <!-- Search Form -->
            <form id="searchForm">
                <div class="search-box">
                    <input type="text" id="cityInput" class="form-control" placeholder="Search your city..."
                        autocomplete="off">
                    <button type="submit" aria-label="Search weather">
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </form>
            <!-- Loading -->
            <div id="loading">
                <div class="spinner-border text-light"></div>
                <p class="mt-2">Getting weather information...</p>
            </div>

            <!-- Error -->
            <div id="errorMessage"></div>
            <!-- Weather Result -->
            <div id="result">

                <!-- Welcome Message -->
                <div class="welcome-message">
                    <i class="fa-solid fa-cloud-sun"></i>
                    <h4>Welcome to Weather App</h4>
                    <p>Enter a city name above to discover its current weather.</p>
                </div>
            </div>
        </div>
        <!-- Footer -->
        <div class="footer">
            <p>All Rights Reserved @LuminarTechnolab</p>
        </div>
    </div>

    <!-- JavaScript -->

    <script>

        async function getWeather() {

    const city = document.getElementById("cityInput").value.trim();

    const loading = document.getElementById("loading");
    const errorMessage = document.getElementById("errorMessage");

    if (city === "") {
        errorMessage.innerText = "Please enter a location";
        return;
    }

    loading.style.display = "block";
    errorMessage.innerText = "";

    try {

        const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=8ac5c4d57ba6a4b3dfcf622700447b1e&units=metric`;

        const response = await fetch(url);

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.message || "Location not found");
        }

        displayWeather(data);

    }
    catch (error) {

        errorMessage.innerText = error.message;

    }
    finally {

        loading.style.display = "none";

    }
}
        // Form submission
        document.getElementById("searchForm").addEventListener("submit", function (event) {
            event.preventDefault();
            getWeather();
        });

        // Display Weather Function
        function displayWeather(data) {
            const result = document.getElementById("result");
            // Weather Condition
            const condition = data.weather[0].main.toLowerCase();
            // Default Icon
            let icon = "fa-cloud";
            // Change Weather Icon
            if (condition === "clear") {
                icon = "fa-sun";
            }
            else if (condition === "clouds") {
                icon = "fa-cloud";
            }
            else if (condition === "rain" || condition === "drizzle") {
                icon = "fa-cloud-rain";
            }
            else if (condition === "thunderstorm") {
                icon = "fa-cloud-bolt";
            }
            else if (condition === "snow") {
                icon = "fa-snowflake";
            }
            else if (["mist", "fog", "haze"].includes(condition)) {
                icon = "fa-smog";
            }
            // Display Weather Details
            result.innerHTML = `
                <!-- Main Weather Card -->
                <div class="current-weather">
                    <div class="city-date">
                        <h3>
                            <i class="fa-solid fa-location-dot text-danger"></i>
                            <span id="cityName"></span>
                        </h3>
                        <small id="date"></small>
                    </div>
                    <p id="country"></p>
                    <!-- Temperature -->
                    <div class="temperature-section">
                        <div>
                            <i id="weatherIcon"
                                class="fa-solid ${icon} weather-icon">
                            </i>
                        </div>
                        <div>
                            <h1 class="temperature">
                                <span id="temperature"></span>°C
                            </h1>
                            <p id="description"
                                class="weather-description">
                            </p>
                        </div>
                    </div>
                </div>

                <!-- Weather Details -->
                <div class="row g-2">
                    <!-- Feels Like -->
                    <div class="col-6 col-md-3">
                        <div class="detail-card">
                            <i class="fa-solid fa-temperature-half detail-icon"></i>
                            <p>Feels Like</p>
                            <h5 id="feelsLike"></h5>
                        </div>
                    </div>
                    <!-- Humidity -->
                    <div class="col-6 col-md-3">
                        <div class="detail-card">
                            <i class="fa-solid fa-droplet detail-icon"></i>
                            <p>Humidity</p>
                            <h5 id="humidity"></h5>
                        </div>
                    </div>
                    <!-- Wind Speed -->
                    <div class="col-6 col-md-3">
                        <div class="detail-card">
                            <i class="fa-solid fa-wind detail-icon"></i>
                            <p>Wind Speed</p>
                            <h5 id="windSpeed"></h5>
                        </div>
                    </div>
                    <!-- Pressure -->
                    <div class="col-6 col-md-3">
                        <div class="detail-card">
                            <i class="fa-solid fa-gauge-high detail-icon"></i>
                            <p>Pressure</p>
                            <h5 id="pressure"></h5>
                        </div>
                    </div>
                </div>
            `;

            // Assign API Values

            document.getElementById("cityName").innerText =
                data.name;
            document.getElementById("country").innerText =
                data.sys.country;
            document.getElementById("date").innerText =
                new Date().toLocaleDateString("en-GB");
            document.getElementById("temperature").innerText =
                Math.round(data.main.temp);
            document.getElementById("description").innerText =
                data.weather[0].description;
            document.getElementById("feelsLike").innerText =
                Math.round(data.main.feels_like) + "°C";
            document.getElementById("humidity").innerText =
                data.main.humidity + "%";
            document.getElementById("windSpeed").innerText =
                data.wind.speed.toFixed(2) + " m/s";
            document.getElementById("pressure").innerText =
                data.main.pressure + " hPa";
        }

        // Error Function
        function showError(message) {
            document.getElementById("errorMessage").innerText = message;
        }
    </script>
</body>

</html>
